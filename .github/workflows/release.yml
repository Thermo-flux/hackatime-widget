name: Build and release

# Push a tag like v0.1.0 to build installers for Windows, macOS (Apple Silicon + Intel) and Linux,
# and publish them on the GitHub release for that tag. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, target: "" }
          - { name: macos-arm, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-intel, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: linux, os: ubuntu-22.04, target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The npm package ships a prebuilt CLI; `cargo install tauri-cli` compiled it from source on every run (minutes).
      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      # The tests are platform-independent, so one runner is enough; the others skip a whole extra compile.
      - name: Run tests
        if: matrix.name == 'linux'
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installers
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            tauri build --target ${{ matrix.target }}
          else
            tauri build
          fi

      # A no-install build: download, double-click. Settings are then kept next to the exe.
      - name: Portable Windows exe
        if: matrix.name == 'windows'
        shell: bash
        run: cp src-tauri/target/release/hackatime-widget.exe src-tauri/target/release/bundle/Hackatime-Widget-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: hackatime-widget-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
